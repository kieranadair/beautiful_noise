# ============================================================================
# Beautiful Noise — Custom Theme
# ============================================================================

[server]
enableStaticServing = true

[theme]
base = "light"

# ── Colours ───────────────────────────────────────────────────────────────
primaryColor = "#ff0066"
backgroundColor = "#f5f5f5"
secondaryBackgroundColor = "#ffffff"
textColor = "#121212"
linkColor = "#757575"
linkUnderline = true

# ── Fonts (Google Fonts) ─────────────────────────────────────────────────
font = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700"
headingFont = "Press Start 2P:https://fonts.googleapis.com/css2?family=Press+Start+2P"
codeFont = "monospace"

baseFontSize = 18
baseFontWeight = 400
headingFontSizes = ["6rem", "2.5rem", "1.75rem", "1.5rem", "1.25rem", "1rem"]
headingFontWeights = [700, 700, 600, 600, 600, 600]
codeFontSize = "0.875rem"

# ── Borders & Radius ─────────────────────────────────────────────────────
baseRadius = "none"
showWidgetBorder = true
showSidebarBorder = true
